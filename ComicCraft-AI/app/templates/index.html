<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft - AI Comic Story Creator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ComicCraft</h1>

    <form action="/generate" method="post">

        <label for="story_prompt">Story Prompt</label>
        <textarea
            id="story_prompt"
            name="story_prompt"
            placeholder="Enter your comic story idea..."
            required
        ></textarea>

        <label for="character_name">Main Character Name</label>
        <input
            type="text"
            id="character_name"
            name="character_name"
            value="Alex"
        >

        <label for="setting">Setting</label>
        <select id="setting" name="setting">
            <option value="forest">Forest</option>
            <option value="school">School</option>
            <option value="space">Space</option>
            <option value="city">City</option>
        </select>

        <label for="tone">Story Tone</label>
        <select id="tone" name="tone">
            <option value="adventurous">Adventurous</option>
            <option value="light-hearted">Light-hearted</option>
            <option value="dramatic">Dramatic</option>
            <option value="poetic">Poetic</option>
            <option value="funny">Funny</option>
        </select>

        <label for="art_style">Art Style</label>
        <select id="art_style" name="art_style">
            <option value="anime">Anime</option>
            <option value="pixel art">Pixel Art</option>
            <option value="comic book">Comic Book</option>
            <option value="realistic">Realistic</option>
        </select>

        <button type="submit">
            Generate Comic
        </button>

    </form>

</div>

</body>
</html>
